[package]
name = "mariliz-desktop-host"
version = "0.1.0"
description = "Host desktop do Mariliz Studio"
edition = "2021"
rust-version = "1.90"

[lib]
name = "mariliz_desktop_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-shell = "2.5.0"
tauri-plugin-single-instance = "2.5.4"
tokio = { version = "1.54.1", features = ["sync", "time"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
