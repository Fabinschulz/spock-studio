packages:
  - desktop/ui
  - desktop/host

# pnpm 11+ bloqueia script de instalação de dependência que não estiver aqui. O do @parcel/watcher (via sass-embedded e vite)
# só compila do código-fonte quando falta o binário pronto, que já vem pelas dependências opcionais de cada plataforma.
allowBuilds:
  '@parcel/watcher': false

# O pnpm segura versões publicadas há pouco tempo. O ui-kit é nosso e cada versão sai junto com a mudança que a usa:
# a exceção vale só para a versão em uso e pode sair quando ela deixar de ser recente.
minimumReleaseAgeExclude:
  - '@mariliz/ui-kit@0.9.0'
