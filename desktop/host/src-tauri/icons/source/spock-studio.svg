<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 32 32">
  <!-- Spock Studio (System of Programming, Organization, Code and Knowledge): o olhar lógico.
       Tile ink #050c0c. Uma sobrancelha reta e dois olhos em névoa #f1f7f6; a outra sobrancelha erguida em teal #33c1ba,
