name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: motor .NET
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Os Evals do hook e das validações da especificação executam scripts Python; a versão é fixa para o resultado não depender do runner.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Dependências da inteligência (LangGraph) com hash verificado, em intelligence/packages.
      - name: dependências da inteligência
        run: python scripts/package-intelligence.py dev
      # Os testes de contrato comparam a saída do runtime com contracts/fixtures/golden. Se o formato mudar de
      # propósito, regenere com MARILIZ_UPDATE_GOLDEN=1 dotnet test e revise o diff das fixtures.
      - name: testes
        run: dotnet test runtime/Mariliz.sln --nologo
      - name: inteligência (Python)
        run: python -m unittest discover -s intelligence/tests -p "test_*.py" -v

  ui:
    name: interface React
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ui:typecheck
      - run: pnpm ui:lint
      - run: pnpm --filter @mariliz/desktop-ui format:check
      - run: pnpm ui:test
      - run: pnpm ui:build

  desktop:
    name: instalador (${{ matrix.name }})
    needs: [engine, ui]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rid: win-x64
            triple: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-arm64
            os: macos-latest
            rid: osx-arm64
            triple: aarch64-apple-darwin
            bundles: dmg
          - name: linux-x64
            os: ubuntu-22.04
            rid: linux-x64
            triple: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Monta o pacote da inteligência; o bytecode precisa da mesma versão menor do interpretador embarcado (3.12).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/host/src-tauri
      - name: dependências do Linux (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: motor e recursos embarcados (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-runtime.ps1 -Rid ${{ matrix.rid }} -FetchPythonEmbed
      - name: motor como sidecar (demais plataformas)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dotnet publish runtime/Mariliz.Runtime/Mariliz.Runtime.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o dist/runtime/${{ matrix.rid }}
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "dist/runtime/${{ matrix.rid }}/Mariliz.Runtime$ext" "desktop/host/src-tauri/binaries/mariliz-runtime-${{ matrix.triple }}$ext"
      # CPython do python-build-standalone (ADR-0001, D2), hash fixado no script, mais a inteligência em bytecode.
      - name: inteligência e interpretador embarcados (demais plataformas)
        if: runner.os != 'Windows'
        run: python scripts/package-intelligence.py bundle --resources desktop/host/src-tauri/resources --python ${{ matrix.triple }}
      - name: runtime de IA pronto no pacote
        env:
          MARILIZ_PACKAGED_RESOURCES: ${{ github.workspace }}/desktop/host/src-tauri/resources
        run: dotnet test runtime/Mariliz.sln --filter "FullyQualifiedName~Pacote_embarcado" --nologo
      # Formatação e lint do host valem igual nas três plataformas; rodam uma vez, no Linux.
      - name: formatação e lint do host
        if: runner.os == 'Linux'
        working-directory: desktop/host/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
      - name: testes do host
        working-directory: desktop/host/src-tauri
        run: cargo test
      - name: instalador
        working-directory: desktop/host
        env:
          # O AppImage é gerado sem FUSE nos runners hospedados.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm tauri build --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: mariliz-${{ matrix.name }}
          path: desktop/host/src-tauri/target/${{ matrix.triple }}/release/bundle/**
          if-no-files-found: error
          # Cada instalador tem de 25 a 480 MB e cada execução gera três. Com os 90 dias padrão, a cota de
          # armazenamento do repositório estourou e o upload passou a falhar. Três dias bastam para testar um PR.
          retention-days: 3
